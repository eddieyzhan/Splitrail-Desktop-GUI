[project]
name = "splitrail-desktop"
version = "1.2.0"
description = "Codex quota cutoffs, local process monitoring and private AI coding usage tracking"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "ijson>=3.4,<4", "psutil>=7.2,<8"]
license = "MIT"

[project.optional-dependencies]
test = ["tzdata>=2026.1"]

[project.scripts]
splitrail-desktop = "splitrail_desktop.__main__:main"

[tool.pyright]
pythonVersion = "3.11"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
splitrail_desktop = ["model_prices.json", "qml/*.qml", "qml/qmldir"]
