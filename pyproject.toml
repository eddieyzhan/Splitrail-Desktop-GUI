[project]
name = "splitrail-desktop"
version = "1.1.1"
description = "Private desktop usage dashboard with optional multi-device GitHub sync"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "ijson>=3.4,<4"]
license = "MIT"

[project.scripts]
splitrail-desktop = "splitrail_desktop.__main__:main"

[tool.pyright]
pythonVersion = "3.11"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
splitrail_desktop = ["model_prices.json", "qml/*.qml", "qml/qmldir"]
